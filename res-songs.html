<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찬양 — 2026 키르기스스탄 단기선교</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1565C0; --primary-light: #42A5F5; --primary-dark: #0D47A1;
    --accent: #00BCD4; --accent-light: #80DEEA;
    --cream: #F0F7FF; --sand: #E1F0FD;
    --text: #1A2A3A; --text-light: #5A7A9A; --white: #FFFFFF;
    --card-bg: rgba(255,255,255,0.94);
    --shadow: 0 8px 32px rgba(21,101,192,0.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { font-size:17px; scroll-behavior:smooth; }
  body { background:var(--cream); color:var(--text); font-family:'Noto Sans KR',sans-serif; line-height:1.7; }

  /* ── Nav ── */
  .nav { position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid rgba(66,165,245,0.12); box-shadow:0 2px 12px rgba(21,101,192,0.06); }
  .nav-inner { max-width:860px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:56px; }
  .nav-logo { font-family:'Noto Serif KR',serif; font-size:0.92rem; font-weight:900; color:var(--primary); text-decoration:none; white-space:nowrap; }
  .nav-logo span { color:var(--accent); }
  .nav-menu { display:flex; gap:4px; list-style:none; }
  .nav-menu a { display:block; padding:8px 16px; font-size:0.82rem; font-weight:600; color:var(--text-light); text-decoration:none; border-radius:8px; transition:all 0.2s; }
  .nav-menu a:hover { color:var(--primary); background:rgba(66,165,245,0.08); }
  .nav-menu a.active { color:var(--primary); background:rgba(66,165,245,0.1); }
  .nav-toggle { display:none; background:none; border:none; font-size:1.4rem; color:var(--text); cursor:pointer; padding:4px; }
  @media (max-width:600px) {
    .nav-toggle { display:block; }
    .nav-menu { display:none; position:absolute; top:56px; left:0; right:0; background:rgba(255,255,255,0.97); backdrop-filter:blur(12px); flex-direction:column; padding:8px 16px 16px; border-bottom:1px solid rgba(66,165,245,0.12); box-shadow:0 8px 24px rgba(21,101,192,0.08); }
    .nav-menu.open { display:flex; }
    .nav-menu a { padding:12px 16px; font-size:0.9rem; }
  }

  /* ── Page ── */
  .container { max-width:860px; margin:0 auto; padding:0 24px; }
  .back-link { display:inline-flex; align-items:center; gap:6px; margin-top:24px; padding:8px 16px; font-size:0.84rem; font-weight:600; color:var(--primary); text-decoration:none; border-radius:8px; transition:all 0.2s; }
  .back-link:hover { background:rgba(66,165,245,0.08); }
  .page-header { padding:32px 0 28px; text-align:center; }
  .page-header h1 { font-family:'Noto Serif KR',serif; font-size:1.8rem; font-weight:900; color:var(--primary); margin-bottom:8px; }
  .page-header p { color:var(--text-light); font-size:0.92rem; }

  /* ── Song Card ── */
  .schedule-card {
    background:var(--card-bg);
    border-radius:16px;
    box-shadow:var(--shadow);
    border:1px solid rgba(66,165,245,0.12);
    margin-bottom:28px;
    overflow:hidden;
  }
  .schedule-header {
    padding:22px 28px;
    color:#fff;
  }
  .schedule-header h2 {
    font-family:'Noto Serif KR',serif;
    font-size:1.2rem;
    font-weight:900;
  }
  .schedule-header p {
    font-size:0.78rem;
    opacity:0.85;
    margin-top:4px;
  }
  .schedule-body { padding:28px; }

  /* ── Footer ── */
  footer { background:var(--primary-dark); color:rgba(255,255,255,0.85); text-align:center; padding:32px 24px; font-size:0.8rem; line-height:1.7; margin-top:40px; }
  footer strong { color:var(--accent-light); }

  @media (max-width:600px) {
    html { font-size:15px; }
    .schedule-header { padding:18px 22px; }
    .schedule-body { padding:22px; }
  }
</style>
</head>
<body>

<!-- ══════ Navigation ══════ -->
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">키르기스스탄 <span>단기선교</span></a>
    <button class="nav-toggle" onclick="document.querySelector('.nav-menu').classList.toggle('open')" aria-label="메뉴">☰</button>
    <ul class="nav-menu">
      <li><a href="index.html">안내</a></li>
      <li><a href="worship.html">예배</a></li>
      <li><a href="board.html">게시판</a></li>
      <li><a href="gallery.html">사진게시판</a></li>
      <li><a href="resources.html" class="active">선교자료</a></li>
    </ul>
  </div>
</nav>

<!-- ══════ Content ══════ -->
<div class="container">
  <a href="resources.html" class="back-link">← 선교자료로 돌아가기</a>

  <div class="page-header">
    <h1>🎵 찬양</h1>
    <p>선교 현지에서 함께 부를 찬양입니다</p>
  </div>

  <div class="schedule-card">
    <div class="schedule-header" style="background:linear-gradient(135deg, #AD1457, #E91E63);">
      <h2>🎵 예배합니다 (I will worship you)</h2>
      <p>작사·작곡 Rose Park / 번역 민호기 / 채보 김주형</p>
    </div>
    <div class="schedule-body" style="text-align:center;">
      <img src="images/worship_song_01.png" alt="예배합니다 악보" style="max-width:100%; border-radius:12px; box-shadow:var(--shadow);">
      <p style="font-size:0.78rem; color:var(--text-light); margin-top:12px;">키르기스어 발음 포함 · 한국어/러시아어/키르기스어</p>
    </div>
  </div>

</div>

<!-- ══════ Footer ══════ -->
<footer>
  <strong>서울광염교회 × 2026 키르기스스탄 여름 단기선교</strong><br>
  함께 기도하고, 함께 섬기며, 함께 나눕니다
</footer>

</body>
</html>
